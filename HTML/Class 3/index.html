<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h1>Image Tag</h1>
    <img src="crped.jpg" alt="Deva" width="100" height="100">
    <div>
        <h1>Video Tag</h1>
        <video controls><source src="24BCS057.mp4">
            </video>
    </div>
    <div>
        <h1>Audio Tag</h1>
        <audio controls>
        <source src="24BCS057.mp4">
    </audio>
    <h1>Iframe Tag</h1>
    <iframe src="https://en.wikipedia.org/wiki/Wiki" height="100" frameborder="20"></iframe>
    </div>
    <form>
        <h1>User Registration</h1>
        <div>
<label for="name">Username</label>
        <input type="text" id="name">
        </div>
        <div>
<label for="age">Age</label>
        <input type="number" id="age">
        </div>
        <div>
<label for="em">Email</label>
        <input type="email" id="em">
        </div>
        <div>
        <label for="gender">Gender</label><br>
        <input type="radio" name="gender" id="male"><label for="male">Male</label>
        <input type="radio" name="gender" id="female"><label for="female">Female</label>
        <input type="radio" name="gender" id="others"><label for="others">Others</label>
        </div>
        <div>
        <label for="col">Colors</label><br>
        <input type="checkbox" name="col" id="red"><label for="red">Red</label>
        <input type="checkbox" name="col" id="blue"><label for="blue">Blue</label>
        <input type="checkbox" name="col" id="gold"><label for="gold">Gold</label>
        <input type="checkbox" name="col" id="black"><label for="black">Black</label>
        </div>
        
    </form>
    
</body>
